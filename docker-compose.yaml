services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: fab_identity
      POSTGRES_USER: fab_identity
      POSTGRES_PASSWORD: fab_identity
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fab_identity"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: .
    environment:
      FAB_DATABASE_URL: postgresql+psycopg://fab_identity:fab_identity@postgres:5432/fab_identity
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

