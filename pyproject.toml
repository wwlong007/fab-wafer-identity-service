[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fab-wafer-identity-service"
version = "0.1.0"
description = "Backend service for wafer layouts, coordinate frames, and test observations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "pytest-timeout==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fab_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 30

[tool.ruff]
target-version = "py312"
line-length = 100

